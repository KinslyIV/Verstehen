[project]
name = "verstehen"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "aiosqlite>=0.22.1",
    "claude-agent-sdk>=0.2.185",
    "fastapi>=0.165.0",
    "playwright>=1.65.2",
    "pydantic>=2.14.3",
    "pydantic-ai-slim[openai]==2.70.0",
    "pypdfium2>=5.15.2",
    "resvg-py==0.5.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
verstehen = "verstehen.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyrefly",
    "import-linter",
    "httpx2>=2.0.0",
    "pyinstaller>=6.22,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests", "../tools/tests"]
pythonpath = [".."]
filterwarnings = ["error"]
addopts = "-m 'not live'"
markers = ["live: opt-in real provider calls using a temporary data directory"]

[tool.importlinter]
root_package = "verstehen"

[[tool.importlinter.contracts]]
name = "Move dependencies down: api -> session -> features -> agents -> store"
type = "layers"
broken_contract_guidance = "Move dependencies down the declared layers; pass callbacks from session for upward notifications."
layers = [
  "verstehen.api",
  "verstehen.session",
  "verstehen.jobs | verstehen.sidechat | verstehen.graph",
  "verstehen.teaching | verstehen.providers",
  "verstehen.store",
]
