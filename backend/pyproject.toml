[project]
name = "verstehen"
version = "0.2.0"
license = "AGPL-3.0-only"
requires-python = "==3.14.*"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncssh>=2.19.0",
    "claude-agent-sdk>=0.2.185",
    "fastapi>=0.165.0",
    "httpx2>=2.0.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-ai-slim[anthropic,mcp,openai]==2.70.0",
    "pypdfium2>=5.15.2",
    "regex>=2026.11.19",
    "resvg-py==0.5.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.12", "PySide6-WebEngine>=6.12"]
server = ["playwright>=1.65.2"]

[project.scripts]
verstehen = "verstehen.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
    "pyrefly",
    "import-linter",
    "pyinstaller>=6.22,<7",
    "verstehen[desktop,server]",
]

[tool.pytest.ini_options]
testpaths = ["tests", "../tools/tests"]
pythonpath = [".."]
filterwarnings = ["error"]
addopts = "-m 'not live'"
markers = [
    "live: opt-in requests using the installed provider and user subscription",
    "slow: real CLI subprocess or headless Chromium tests skipped in area-scoped runs",
]

[tool.importlinter]
root_package = "verstehen"

[[tool.importlinter.contracts]]
name = "Move dependencies down: api -> session -> features -> agents -> store"
type = "layers"
broken_contract_guidance = "Move dependencies down the declared layers; pass callbacks from session for upward notifications."
layers = [
  "verstehen.desktop",
  "verstehen.api | verstehen.lh_import",
  "verstehen.sync",
  "verstehen.session",
  "verstehen.jobs | verstehen.sidechat | verstehen.graph | verstehen.plugins",
  "verstehen.teaching | verstehen.providers",
  "verstehen.store",
]
